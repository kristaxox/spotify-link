// Managed by stereo-link — PulseAudio/PipeWire backend for coexistence with Raspotify.
general =
{
  name = "@SPEAKER_NAME@";
  output_backend = "pa";
  mdns_backend = "avahi";
  interpolation = "auto";
  drift_tolerance_in_seconds = 0.002;
  resync_threshold_in_seconds = 0.050;
  playback_mode = "stereo";
  alac_decoder = "hammerton";
  ignore_volume_control = "no";
  volume_range_db = 60;
  run_this_before_play_begins = "/usr/bin/true";
  run_this_after_play_ends = "/usr/bin/true";
  run_this_before_entering_active_state = "/usr/bin/true";
  run_this_after_exiting_active_state = "/usr/bin/true";
  active_state_timeout = 10.0;
  use_mmap_if_available = "yes";
  disable_synchronization = "no";
};

pa =
{
  application_name = "@SPEAKER_NAME@";
};

metadata =
{
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
  image_cache_directory = "/tmp/shairport-sync/.cache/coverart";
};

diagnostics =
{
  disable_resend_requests = "no";
};
